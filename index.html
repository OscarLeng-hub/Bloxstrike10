<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 歐皇神話至尊盲盒 - 高級營運版</title>
    <style>
        :root {
            --primary: #ff4e50;
            --dark-bg: #0b0c10;
            --card-bg: #14161d;
            --border-color: #222530;
            --gold: #fbc02d;
            --red: #eb4b4b;
            --pink: #d32ce6;
            --purple: #8847ff;
            --blue: #4b69ff;
        }

        body {
            font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif;
            background-color: var(--dark-bg);
            color: #ffffff;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        header {
            width: 100%; background-color: #07080b; padding: 15px 0;
            border-bottom: 2px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center;
            position: sticky; top: 0; z-index: 90;
        }

        .logo { font-size: 22px; font-weight: 900; background: linear-gradient(135deg, var(--primary), var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .balance { background: rgba(251, 192, 45, 0.1); border: 1px solid var(--gold); padding: 6px 15px; border-radius: 20px; color: var(--gold); font-weight: bold; }

        .container { max-width: 900px; width: 95%; margin: 20px auto; }

        .notice-banner { background: rgba(255,78,80,0.05); border: 1px solid #ff4e5033; border-radius: 8px; padding: 12px; margin-bottom: 15px; font-size: 13px; color: #aaa; }

        .cdk-section { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; margin-bottom: 20px; text-align: center; }
        .cdk-input { background: #07080b; border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; color: white; width: 180px; margin-right: 10px; }

        .tab-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
        .tab { background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px 5px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 11px; transition: 0.3s; }
        .tab.active { border-color: var(--primary); color: var(--primary); background: rgba(255, 78, 80, 0.1); }

        .machine-box { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 25px; position: relative; }

        .pity-container { background: #07080b; border-radius: 10px; padding: 12px; margin: 15px 0; border: 1px solid #1f212a; }
        .pity-info { display: flex; justify-content: space-between; font-size: 13px; color: #aaa; margin-bottom: 5px; }
        .pity-bar-bg { background: #222; width: 100%; height: 12px; border-radius: 6px; overflow: hidden; }
        .pity-bar-fill { background: linear-gradient(90deg, var(--red), var(--primary)); width: 0%; height: 100%; transition: width 0.5s; }

        .roulette-viewport {
            width: 100%; height: 140px; background: #07080a; border: 2px solid #2d313d;
            border-radius: 4px; position: relative; overflow: hidden; margin: 20px 0;
        }
        .roulette-viewport.fullscreen-focus {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.1);
            width: 90vw; z-index: 9999; box-shadow: 0 0 100px #000;
        }

        .pointer { position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: var(--gold); z-index: 10; transform: translateX(-50%); }
        .roulette-track { display: flex; position: absolute; left: 0; top: 15px; height: 110px; }

        .skin-card {
            width: 120px; height: 110px; background: rgba(30, 33, 41, 0.4); margin: 0 2px;
            flex-shrink: 0; border-bottom: 5px solid #888; display: flex; flex-direction: column;
            justify-content: space-between; align-items: center; padding: 10px 5px; box-sizing: border-box;
        }
        .skin-card img { width: 85px; height: 60px; object-fit: contain; }
        .skin-name { font-size: 10px; color: #ced4da; white-space: nowrap; overflow: hidden; width: 100%; }

        .rarity-red { border-bottom-color: var(--red); }
        .rarity-pink { border-bottom-color: var(--pink); }
        .rarity-purple { border-bottom-color: var(--purple); }
        .rarity-blue { border-bottom-color: var(--blue); }
        .rarity-gold { border-bottom-color: var(--gold); }

        .skip-control { margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; color: #aaa; cursor: pointer; }
        .btn { background: linear-gradient(135deg, var(--primary), #d9383a); border: none; color: white; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .btn-group { display: flex; gap: 10px; justify-content: center; }

        .inventory-section { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 15px; }
        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
        .inv-item { background: #0f1015; border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; text-align: center; }
        .inv-item img { width: 60px; }

        .fullscreen-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.98); z-index: 10000; flex-direction: column; justify-content: center; align-items: center;
        }
        .reward-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; }
        .reward-card { width: 140px; background: #1a1c24; border-radius: 10px; padding: 15px; text-align: center; border: 1px solid #333; }
        
        .spin-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 9998; }
    </style>
</head>
<body>

    <div class="spin-overlay" id="spin-overlay-mask"></div>

    <header>
        <div class="logo">CS2 歐皇神話至尊盲盒</div>
        <div class="balance" id="balance-val">0 金幣</div>
    </header>

    <div class="container">
        <div class="notice-banner">
            ⚠️ 溫馨提示：本活動道具提取均由人工客服登記，預計 12 小時內完成發貨。道具一經提取，不設回收。
        </div>

        <div class="cdk-section">
            <input type="text" class="cdk-input" id="cdk-input" placeholder="輸入閒魚CDK">
            <button class="btn" onclick="redeemCDK()">立即充值</button>
        </div>

        <div class="tab-container">
            <div class="tab active" onclick="switchMachine('guns')">🔫 熱門主戰槍</div>
            <div class="tab" onclick="switchMachine('pink_purple')">🌸 猛男粉紫</div>
            <div class="tab" onclick="switchMachine('gloves')">🧤 至尊手套</div>
            <div class="tab" onclick="switchMachine('swords')">⚔️ 關刀神針</div>
            <div class="tab" onclick="switchMachine('karambits')">😈 爪子刀</div>
        </div>

        <div class="machine-box">
            <h2 id="machine-title">熱門主戰槍機台</h2>
            <div class="pity-container">
                <div class="pity-info">
                    <span id="pity-title-text">🔴 紅色主戰槍契合度</span>
                    <span id="pity-percent-text">契合進度: 0%</span>
                </div>
                <div class="pity-bar-bg"><div class="pity-bar-fill" id="pity-bar-fill"></div></div>
            </div>

            <div class="roulette-viewport" id="roulette-viewport-id">
                <div class="pointer"></div>
                <div class="roulette-track" id="roulette-track"></div>
            </div>

            <label class="skip-control">
                <input type="checkbox" id="skip-animation-checkbox"> ⚡ 跳過動畫（秒速開箱）
            </label>

            <div class="btn-group">
                <button class="btn" id="spin-btn-1" onclick="startSpin(1)">單抽</button>
                <button class="btn" id="spin-btn-5" style="background: #7b1fa2;" onclick="startSpin(5)">五連抽</button>
            </div>
        </div>

        <div class="inventory-section">
            <h3>🎒 存儲背包</h3>
            <div class="inventory-grid" id="inventory-grid"></div>
        </div>
    </div>

    <div class="fullscreen-modal" id="reward-fullscreen-modal">
        <h2 style="color:var(--gold)">恭喜獲得稀有道具</h2>
        <div class="reward-container" id="fullscreen-reward-container"></div>
        <button class="btn" style="margin-top:30px; padding: 15px 50px;" onclick="closeFullscreenModal()">收下道具</button>
    </div>

    <script>
        // --- 核心數據 ---
        let balance = parseInt(localStorage.getItem('cs_balance')) || 0;
        let inventory = JSON.parse(localStorage.getItem('cs_inventory')) || [];
        let localSpinCount = parseInt(localStorage.getItem('cs_spin_total')) || 0;
        let sessionSpent = parseInt(localStorage.getItem('cs_session_spent')) || 0; // 追蹤使咗幾多錢

        let currentMachine = 'guns';

        const MACHINES = {
            guns: { title: "🔫 熱門主戰槍機台", cost: 2, 
                redPrizes: [{ name: "AK-47 | 火蛇 (紅色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r2t1WSv3R8fKx38fdX01_Ignv4beYJAJu7PzHeDNL4t-klY6FkvX3b_WGlT9XvZEpju_E9N2g2VfsrkE9MTrnd9SdeAY8NFDYr1K_ye_mjsS7tIOvsw", rarity: "rarity-red" }],
                purplePrizes: [{ name: "Galil AR | 糖果 (紫色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r5t1WSv2U8vqn38fdVkt_LAtosreYJAJu7PzHeDNL69SxlI6Fm_X3O-OFkT9XvZEpju_E9Niz3lfsrkM9MTynd9SdeAY8M1DYr1O6xOzoisS7tIO78Q", rarity: "rarity-purple" }],
                bluePrizes: [{ name: "P250 | 漣漪 (藍色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r5t1WSv2U8vqn38fdVkt_LAtosreYJAJu7PzHeDNL69SxlI6Fm_X3O-OFkT9XvZEpju_E9Niz3lfsrkM9MTynd9SdeAY8M1DYr1O6xOzoisS7tIO78Q", rarity: "rarity-blue" }],
                goldPrizes: [{ name: "★ M9 刺刀 | 漸變 (金色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r805WSv_S-Oun38fdV1t_LQZosreYJAhv7PvHfDxL69mkkY6FlvX3Z6-FkT9XvZEpju_E9Nym0VbkrRE-Yzund9SdewY7Ml_U_wTo28S4S8Sj_A", rarity: "rarity-gold" }]
            },
            pink_purple: { title: "🌸 猛男粉紫機台", cost: 3, redPrizes: [{ name: "M4A1-S | 角色 (紅色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r2t1WSv3R8fKx38fdX01_Ignv4beYJAJu7PzHeDNL4t-klY6FkvX3b_WGlT9XvZEpju_E9N2g2VfsrkE9MTrnd9SdeAY8NFDYr1K_ye_mjsS7tIOvsw", rarity: "rarity-red" }], purplePrizes: [{ name: "Glock | 時尚 (紫色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r5t1WSv2U8vqn38fdVkt_LAtosreYJAJu7PzHeDNL69SxlI6Fm_X3O-OFkT9XvZEpju_E9Niz3lfsrkM9MTynd9SdeAY8M1DYr1O6xOzoisS7tIO78Q", rarity: "rarity-purple" }], bluePrizes: [{ name: "UMP | 蔚藍 (藍色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r5t1WSv2U8vqn38fdVkt_LAtosreYJAJu7PzHeDNL69SxlI6Fm_X3O-OFkT9XvZEpju_E9Niz3lfsrkM9MTynd9SdeAY8M1DYr1O6xOzoisS7tIO78Q", rarity: "rarity-blue" }] },
            gloves: { title: "🧤 至尊手套機台", cost: 40, redPrizes: [{ name: "AK | 血腥運動 (紅色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r2t1WSv3R8fKx38fdX01_Ignv4beYJAJu7PzHeDNL4t-klY6FkvX3b_WGlT9XvZEpju_E9N2g2VfsrkE9MTrnd9SdeAY8NFDYr1K_ye_mjsS7tIOvsw", rarity: "rarity-red" }], purplePrizes: [{ name: "SSG | 狂熱 (紫色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r5t1WSv2U8vqn38fdVkt_LAtosreYJAJu7PzHeDNL69SxlI6Fm_X3O-OFkT9XvZEpju_E9Niz3lfsrkM9MTynd9SdeAY8M1DYr1O6xOzoisS7tIO78Q", rarity: "rarity-purple" }], bluePrizes: [{ name: "Nova | 玩具兵 (藍色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r5t1WSv2U8vqn38fdVkt_LAtosreYJAJu7PzHeDNL69SxlI6Fm_X3O-OFkT9XvZEpju_E9Niz3lfsrkM9MTynd9SdeAY8M1DYr1O6xOzoisS7tIO78Q", rarity: "rarity-blue" }] },
            swords: { title: "⚔️ 關刀與神針", cost: 40, redPrizes: [{ name: "AWP | 電擊 (紅色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r2t1WSv3R8fKx38fdX01_Ignv4beYJAJu7PzHeDNL4t-klY6FkvX3b_WGlT9XvZEpju_E9N2g2VfsrkE9MTrnd9SdeAY8NFDYr1K_ye_mjsS7tIOvsw", rarity: "rarity-red" }], purplePrizes: [{ name: "XM | 入葬 (紫色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r5t1WSv2U8vqn38fdVkt_LAtosreYJAJu7PzHeDNL69SxlI6Fm_X3O-OFkT9XvZEpju_E9Niz3lfsrkM9MTynd9SdeAY8M1DYr1O6xOzoisS7tIO78Q", rarity: "rarity-purple" }], bluePrizes: [{ name: "PP | 大玩家 (藍色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r5t1WSv2U8vqn38fdVkt_LAtosreYJAJu7PzHeDNL69SxlI6Fm_X3O-OFkT9XvZEpju_E9Niz3lfsrkM9MTynd9SdeAY8M1DYr1O6xOzoisS7tIO78Q", rarity: "rarity-blue" }] },
            karambits: { title: "😈 惡魔爪子刀", cost: 40, redPrizes: [{ name: "M4 | 皇帝 (紅色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r2t1WSv3R8fKx38fdX01_Ignv4beYJAJu7PzHeDNL4t-klY6FkvX3b_WGlT9XvZEpju_E9N2g2VfsrkE9MTrnd9SdeAY8NFDYr1K_ye_mjsS7tIOvsw", rarity: "rarity-red" }], purplePrizes: [{ name: "USP | 獵戶 (紫色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r5t1WSv2U8vqn38fdVkt_LAtosreYJAJu7PzHeDNL69SxlI6Fm_X3O-OFkT9XvZEpju_E9Niz3lfsrkM9MTynd9SdeAY8M1DYr1O6xOzoisS7tIO78Q", rarity: "rarity-purple" }], bluePrizes: [{ name: "P90 | 死神 (藍色)", img: "https://community.cloudflare.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVwgdKYehLQyeUhY_IA_O3hld18rMld_kW4ieYxdKz8bPDbYgKqN-g-r5t1WSv2U8vqn38fdVkt_LAtosreYJAJu7PzHeDNL69SxlI6Fm_X3O-OFkT9XvZEpju_E9Niz3lfsrkM9MTynd9SdeAY8M1DYr1O6xOzoisS7tIO78Q", rarity: "rarity-blue" }] }
        };

        // --- 核心：收割算法 (唔公平機制) ---
        function getRiggedSkin() {
            const m = MACHINES[currentMachine];
            const cost = m.cost;

            // 1. 救命草：餘額得返 1-2 抽，派紫色引充值
            if (balance < (cost * 3) && balance >= cost) {
                return m.purplePrizes[0];
            }

            // 2. 紅色大獎鎖：消費每滿 200 金幣，先准出一把
            if (sessionSpent >= 200) {
                sessionSpent = 0; 
                localStorage.setItem('cs_session_spent', 0);
                return m.redPrizes[0];
            }

            // 3. 紫色節奏：每 12 抽派一把 (你 60 把貨，慢慢餵)
            if (localSpinCount % 12 === 0) {
                return m.purplePrizes[0];
            }

            // 4. 墊底全部藍色
            return m.bluePrizes[0];
        }

        // --- 視覺誘導：令滾輪望落好吸引 ---
        function setupTrack(winSkin) {
            const track = document.getElementById('roulette-track');
            track.innerHTML = '';
            for(let i=0; i<85; i++) {
                let s;
                if(i === 65) {
                    s = winSkin; // 呢格係內定中獎嘅
                } else {
                    let r = Math.random();
                    // 視覺欺詐：隨機閃過紅、金、紫
                    if(r < 0.04) s = MACHINES[currentMachine].redPrizes[0];
                    else if(r < 0.10) s = MACHINES[currentMachine].purplePrizes[0];
                    else s = MACHINES[currentMachine].bluePrizes[0];
                }
                const card = document.createElement('div');
                card.className = `skin-card ${s.rarity}`;
                card.innerHTML = `<img src="${s.img}"><div class="skin-name">${s.name}</div>`;
                track.appendChild(card);
            }
        }

        function startSpin(num) {
            if (isSpinning) return;
            const cost = MACHINES[currentMachine].cost * num;
            if (balance < cost) { alert("❌ 金幣不足，請充值！"); return; }

            balance -= cost;
            sessionSpent += cost;
            localStorage.setItem('cs_session_spent', sessionSpent);

            let results = [];
            for(let i=0; i<num; i++) {
                localSpinCount++;
                let s = getRiggedSkin(); // 調用收割算法
                results.push(s);
                inventory.push(s);
            }
            updateUI();

            if(document.getElementById('skip-animation-checkbox').checked) {
                showFullscreenReward(results);
                return;
            }

            // 動畫流程
            isSpinning = true;
            document.getElementById('spin-btn-1').disabled = true;
            document.getElementById('spin-btn-5').disabled = true;
            document.getElementById('spin-overlay-mask').style.display = 'block';

            const viewport = document.getElementById('roulette-viewport-id');
            viewport.classList.add('fullscreen-focus');
            setupTrack(results[results.length-1]);

            const track = document.getElementById('roulette-track');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';

            setTimeout(() => {
                const cardWidth = 124;
                const offset = -(65 * cardWidth) + (viewport.offsetWidth/2) - (cardWidth/2);
                track.style.transition = 'transform 9s cubic-bezier(0.05, 0.9, 0.1, 1)';
                track.style.transform = `translateX(${offset}px)`;
            }, 50);

            setTimeout(() => {
                isSpinning = false;
                viewport.classList.remove('fullscreen-focus');
                document.getElementById('spin-overlay-mask').style.display = 'none';
                document.getElementById('spin-btn-1').disabled = false;
                document.getElementById('spin-btn-5').disabled = false;
                showFullscreenReward(results);
            }, 9200);
        }

        // --- 其他 UI 控制 ---
        function updateUI() {
            document.getElementById('balance-val').innerText = balance + " 金幣";
            document.getElementById('machine-title').innerText = MACHINES[currentMachine].title;
            
            // Pity Bar 顯示進度 (200 為 100%)
            let p = Math.min((sessionSpent / 200) * 100, 100).toFixed(0);
            document.getElementById('pity-bar-fill').style.width = p + '%';
            document.getElementById('pity-percent-text').innerText = `契合進度: ${p}%`;

            localStorage.setItem('cs_balance', balance);
            localStorage.setItem('cs_inventory', JSON.stringify(inventory));
            localStorage.setItem('cs_spin_total', localSpinCount);
            
            renderInventory();
        }

        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';
            inventory.slice().reverse().forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'inv-item';
                div.innerHTML = `<img src="${item.img}"><div style="font-size:10px;">${item.name}</div>`;
                grid.appendChild(div);
            });
        }

        function switchMachine(m) { 
            if(isSpinning) return;
            currentMachine = m; 
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.currentTarget.classList.add('active');
            updateUI(); 
            setupTrack(MACHINES[currentMachine].bluePrizes[0]);
        }

        function redeemCDK() {
            const val = document.getElementById('cdk-input').value;
            if(val) { balance += 100; alert("充值成功！"); updateUI(); }
        }

        function showFullscreenReward(skins) {
            const container = document.getElementById('fullscreen-reward-container');
            container.innerHTML = '';
            skins.forEach(s => {
                const div = document.createElement('div');
                div.className = `reward-card ${s.rarity}`;
                div.innerHTML = `<img src="${s.img}" style="width:100px;"><p style="font-size:11px;">${s.name}</p>`;
                container.appendChild(div);
            });
            document.getElementById('reward-fullscreen-modal').style.display = 'flex';
        }

        function closeFullscreenModal() { document.getElementById('reward-fullscreen-modal').style.display = 'none'; }

        let isSpinning = false;
        updateUI();
        setupTrack(MACHINES.guns.bluePrizes[0]);
    </script>
</body>
</html>
